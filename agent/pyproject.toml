[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verdix-agent"
version = "0.1.0"
description = "VERDIX Enclave Agent for Local Privacy-Preserving Data Evaluation"
authors = [
    { name = "VERDIX Core Team" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0"
]

[project.scripts]
verdix-agent = "verdix_agent.cli:main"

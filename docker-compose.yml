version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verdix-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verdix
    ports:
      - '5432:5432'
    volumes:
      - verdix_postgres_data:/var/lib/postgresql/data

volumes:
  verdix_postgres_data:
